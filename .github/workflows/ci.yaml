---
name: CI

'on':
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: 'read'

jobs:
  ci:
    name: 'ci'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v5'
      - name: 'setup just'
        uses: 'extractions/setup-just@v3'
      - name: 'setup uv with python ${{ matrix.python-version }}'
        uses: 'astral-sh/setup-uv@v7'
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
          python-version: '${{ matrix.python-version }}'
      - name: 'run ci'
        run: 'just ci'
        env:
          UV_PYTHON_VERSION: '${{ matrix.python-version }}'
  changelog:
    name: 'changelog'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v5'
        with:
          fetch-depth: 0
      - name: 'check changelog updated'
        run: |
          git fetch origin main:main
          GIT_LOG=$(git log main..HEAD --pretty=format:"%s %b")
          SKIP_REGEX="no[[:space:]]+major[[:space:]]+changes"
          if echo "$GIT_LOG" | tr '\n' ' ' | grep -Eiq "$SKIP_REGEX"; then
            echo "Bypassing changelog check: 'no major changes' found in commit history"
            exit 0
          fi
          if ! git diff --name-only main...HEAD | grep -q "^CHANGELOG.md$"; then
            echo "Error: Please update CHANGELOG.md"
            exit 1
          fi
  docs:
    name: 'docs'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        python-version:
          - '3.12'
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v5'
      - name: 'setup just'
        uses: 'extractions/setup-just@v3'
      - name: 'setup uv with python ${{ matrix.python-version }}'
        uses: 'astral-sh/setup-uv@v7'
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
          python-version: '${{ matrix.python-version }}'
      - name: 'build docs'
        run: 'just docs'
        env:
          UV_PYTHON_VERSION: '${{ matrix.python-version }}'
