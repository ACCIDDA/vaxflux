---
name: 'CI'

'on':
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: 'read'

jobs:
  docs:
    name: 'docs'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        python-version:
          - '3.12'
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v6'
      - name: 'setup just and uv'
        uses: './.github/actions/setup-just-and-uv'
        with:
          python-version: '${{ matrix.python-version }}'
      - name: 'build docs'
        run: 'just docs'
        env:
          UV_PYTHON_VERSION: '${{ matrix.python-version }}'
  quality:
    name: 'quality'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v6'
      - name: 'setup just and uv'
        uses: './.github/actions/setup-just-and-uv'
        with:
          python-version: '3.12'
      - name: 'run quality checks'
        run: 'just quality'
        env:
          UV_PYTHON_VERSION: '3.12'
  tests:
    name: 'tests (${{ matrix.python-version }}, ${{ matrix.resolution }})'
    needs:
      - 'docs'
      - 'quality'
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
        resolution:
          - 'highest'
          - 'lowest-direct'
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v6'
      - name: 'setup just and uv'
        uses: './.github/actions/setup-just-and-uv'
        with:
          python-version: '${{ matrix.python-version }}'
      - name: 'run tests'
        run: 'just ci-pytest'
        env:
          UV_PYTHON_VERSION: '${{ matrix.python-version }}'
          UV_RESOLUTION: '${{ matrix.resolution }}'
  changelog:
    name: 'changelog'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'checkout repository'
        uses: 'actions/checkout@v6'
        with:
          fetch-depth: 0
      - name: 'check changelog updated'
        run: |
          git fetch origin main:main
          GIT_LOG=$(git log main..HEAD --pretty=format:"%s %b")
          SKIP_REGEX="no[[:space:]]+major[[:space:]]+changes"
          if echo "$GIT_LOG" | tr '\n' ' ' | grep -Eiq "$SKIP_REGEX"; then
            echo "Bypassing changelog check: 'no major changes' found in commit history"
            exit 0
          fi
          if ! git diff --name-only main...HEAD | grep -q "^CHANGELOG.md$"; then
            echo "Error: Please update CHANGELOG.md"
            exit 1
          fi
