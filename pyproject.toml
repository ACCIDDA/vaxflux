[project]
name = "vaxflux"
version = "0.3.0"
description = "Flexible bayesian models for seasonal vaccine uptake."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.17.0,<2",
    "scipy>=1.14.1",
    "arviz>=0.19.0",
    "requests>=2.32.3",
    "pandas>=2.2.2",
    "xarray>=2024.7.0",
    "pydantic>=2.10.6",
    "blackjax>=1.2.5",
    "jax>=0.6.2",
    "numpyro>=0.19.0",
]

[dependency-groups]
dev = [
    "mike>=2.1.3",
    "mkdocs<1.6.0; python_version <= '3.12'",
    "mkdocs>=1.6.0; python_version >= '3.13'",
    "mkdocs-autorefs>=1.4.3",
    "mkdocs-jupyter>=0.24.1",
    "mkdocs-material<9.7.0; python_version <= '3.12'",
    "mkdocs-material>=9.7.0; python_version >= '3.13'",
    "mkdocstrings[python]<0.30.1; python_version <= '3.12'",
    "mkdocstrings[python]>=0.30.1; python_version >= '3.13'",
    "mypy>=1.14.1",
    "pandas-stubs>=2.2.3.241126",
    "pytest>=8.3.2",
    "ruamel-yaml>=0.18.16",
    "ruff>=0.9.4",
    "scipy-stubs>=1.15.1.0",
    "types-requests>=2.32.0.20241016",
    "yamllint>=1.37.1",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.10.8",
]
demo = [
    "vaxflux[plot]",
    "arviz-plots[matplotlib]>=0.5.0",
    "graphviz>=0.21",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.16.6",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = [
    "src/vaxflux/",
    "tests/",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    "COM812",   # Missing trailing comma, not needed when used with the formatter
    "D203",     # 1 blank line required before class docstring
    "D212",     # Multi-line docstring summary should start at the first line
    "PLR2004",  # Consider replacing magic number with a constant variable
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.mccabe]
max-complexity = 12  # Default is 10

[tool.ruff.lint.per-file-ignores]
"demos/**/*" = [
    "T201",     # `print` found
    "T203",     # `pprint` found
]
"docs/**/*" = [
    "INP001",   # Implicit namespace package
]
"scripts/**/*" = [
    "INP001",   # Implicit namespace package
]
"tests/**/*" = [
    "INP001",   # Implicit namespace package
    "S101",     # Use of `assert` detected
    "SLF001",   # Private member accessed
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8  # Default is 5

[tool.mypy]
plugins = ["numpy.typing.mypy_plugin"]
exclude = "demos/*"

[[tool.mypy.overrides]]
module = ["numpyro.*"]
ignore_missing_imports = true
